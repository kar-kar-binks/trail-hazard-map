<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Providence trails 3D</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
html,body{margin:0;height:100%;font:13px system-ui,sans-serif}
#map{position:absolute;inset:0}
#ui{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.92);padding:10px 12px;border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.3);max-width:260px}
#ui select,#ui input{width:100%;margin:4px 0}
#status{margin-top:6px;color:#555}
</style>
</head>
<body>
<div id="map"></div>
<div id="ui">
<b>Trails in 3D</b>
<select id="place"></select>
<label>Terrain exaggeration <span id="exv">1.8</span>x<input id="ex" type="range" min="1" max="5" step="0.1" value="1.8"></label>
<label><input id="sat" type="checkbox" checked style="width:auto"> satellite imagery</label>
<div id="status">loading...</div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const PLACES = {
  "Lincoln Woods State Park": {q: "Lincoln Woods State Park, Rhode Island", c: [-71.4456, 41.8828]},
  "Neutaconkanut Hill Park, Providence": {q: "Neutaconkanut Hill Park, Providence", c: [-71.4890, 41.8040]},
  "Blackstone Gorge, Woonsocket": {q: "Blackstone Gorge, Rhode Island", c: [-71.5330, 42.0190]},
  "Snake Den State Park, Johnston": {q: "Snake Den State Park, Johnston, Rhode Island", c: [-71.5160, 41.8420]},
  "Roger Williams Park, Providence": {q: "Roger Williams Park, Providence", c: [-71.4170, 41.7860]}
};
const sel = document.getElementById("place");
Object.keys(PLACES).forEach(k => sel.add(new Option(k, k)));
const status = document.getElementById("status");
const map = new maplibregl.Map({
  container: "map",
  style: {
    version: 8,
    sources: {
      sat: {type: "raster", tileSize: 256, maxzoom: 19, attribution: "Imagery Esri, Maxar, Earthstar Geographics",
        tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"]},
      osm: {type: "raster", tileSize: 256, maxzoom: 19, attribution: "OpenStreetMap contributors",
        tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"]},
      dem: {type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 14, attribution: "Mapzen terrain tiles (AWS)",
        tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"]}
    },
    layers: [
      {id: "osm", type: "raster", source: "osm", layout: {visibility: "none"}},
      {id: "sat", type: "raster", source: "sat"}
    ],
    terrain: {source: "dem", exaggeration: 1.8}
  },
  center: PLACES["Lincoln Woods State Park"].c,
  zoom: 14.2, pitch: 68, bearing: 20, maxPitch: 85
});
map.addControl(new maplibregl.NavigationControl({visualizePitch: true}));
function setEx(v) { document.getElementById("exv").textContent = v; map.setTerrain({source: "dem", exaggeration: +v}); }
document.getElementById("ex").oninput = e => setEx(e.target.value);
document.getElementById("sat").onchange = e => {
  map.setLayoutProperty("sat", "visibility", e.target.checked ? "visible" : "none");
  map.setLayoutProperty("osm", "visibility", e.target.checked ? "none" : "visible");
};
const ENDPOINTS = ["https://overpass-api.de/api/interpreter", "https://overpass.kumi.systems/api/interpreter", "https://overpass.private.coffee/api/interpreter", "https://maps.mail.ru/osm/tools/overpass/api/interpreter"];
async function fetchTrails(b) {
  const q = `[out:json][timeout:40];way["highway"~"^(path|footway|track|steps)$"](${b.join(",")});out geom tags;`;
  let err;
  for (let round = 0; round < 3; round++) {
    for (const u of ENDPOINTS) {
      try {
        const r = await fetch(u, {method: "POST", body: "data=" + encodeURIComponent(q), headers: {"Content-Type": "application/x-www-form-urlencoded"}});
        if (r.ok) return await r.json();
        err = r.status;
      } catch (e) { err = e.message; }
    }
    status.textContent = `Overpass busy (${err}), retrying...`;
    await new Promise(res => setTimeout(res, 3000 * (round + 1)));
  }
  throw new Error("Overpass unavailable (" + err + ")");
}
function toGeoJSON(osm) {
  return {type: "FeatureCollection", features: osm.elements.filter(e => e.geometry && e.geometry.length > 1).map(e => ({
    type: "Feature", properties: {name: e.tags.name || "", kind: e.tags.highway, sac: e.tags.sac_scale || ""},
    geometry: {type: "LineString", coordinates: e.geometry.map(p => [p.lon, p.lat])}}))};
}
async function locate(p) {
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(p.q));
    const j = await r.json();
    if (j.length) return [+j[0].lon, +j[0].lat];
  } catch (e) {}
  return p.c;
}
async function load(name) {
  const p = PLACES[name];
  status.textContent = "locating...";
  const c = await locate(p);
  map.flyTo({center: c, zoom: 14.4, pitch: 68, bearing: 20, duration: 2500});
  status.textContent = "fetching trails from OpenStreetMap...";
  const b = [c[1] - 0.014, c[0] - 0.018, c[1] + 0.014, c[0] + 0.018];
  try {
    const gj = toGeoJSON(await fetchTrails(b));
    map.getSource("trails").setData(gj);
    const km = gj.features.reduce((a, f) => a + f.geometry.coordinates.slice(1).reduce((s, q, i) => {
      const o = f.geometry.coordinates[i];
      return s + Math.hypot((q[0] - o[0]) * 82.9, (q[1] - o[1]) * 111.2);
    }, 0), 0);
    status.textContent = `${gj.features.length} trail segments, ${km.toFixed(1)} km`;
  } catch (e) { status.textContent = e.message; }
}
map.on("load", () => {
  map.addSource("trails", {type: "geojson", data: {type: "FeatureCollection", features: []}});
  map.addLayer({id: "trails-casing", type: "line", source: "trails", paint: {"line-color": "#000", "line-width": 5, "line-opacity": 0.5}});
  map.addLayer({id: "trails", type: "line", source: "trails", paint: {"line-color": ["match", ["get", "kind"], "track", "#ffd34d", "steps", "#ff5ad1", "#ff7a00"], "line-width": 3}});
  const popup = new maplibregl.Popup({closeButton: false, closeOnClick: false});
  map.on("mousemove", "trails", e => {
    const f = e.features[0];
    popup.setLngLat(e.lngLat).setHTML(`<b>${f.properties.name || "(unnamed)"}</b><br>${f.properties.kind}${f.properties.sac ? " / " + f.properties.sac : ""}`).addTo(map);
  });
  map.on("mouseleave", "trails", () => popup.remove());
  load(sel.value);
});
sel.onchange = () => load(sel.value);
</script>
</body>
</html>
